<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-label="Diagram: a browser uploads a video to the NestJS API Gateway, which streams it to S3, records the job in PostgreSQL and enqueues it in Redis/BullMQ. A Python AI worker takes the job, reads and writes artifacts in S3, updates the job state in PostgreSQL with conditional transitions, and the gateway relays progress back to the browser over Server-Sent Events.">
<style>text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;fill:#ece6da}.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}.title{font-weight:600}.label{fill:#a89f8e}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a89f8e"/></marker></defs>
<rect width="1320" height="680" fill="none"/>
<g><rect x="40" y="250" width="210" height="130" rx="5" fill="#1d1a15" stroke="#ece6da" stroke-width="1.5"/><text x="145.0" y="282" text-anchor="middle" class="title" font-size="15.5">Browser / HTTP client</text><text x="145.0" y="306" text-anchor="middle" class="label mono" font-size="11">multipart upload, REST</text><text x="145.0" y="323" text-anchor="middle" class="label mono" font-size="11">progress over SSE</text></g>
<g><rect x="340" y="170" width="270" height="290" rx="5" fill="#16302a" stroke="#5fb592" stroke-width="1.5"/><text x="475.0" y="202" text-anchor="middle" class="title" font-size="15.5">API Gateway</text><text x="475.0" y="226" text-anchor="middle" class="label mono" font-size="11">NestJS + Fastify</text><text x="475.0" y="243" text-anchor="middle" class="label mono" font-size="11"></text><text x="475.0" y="260" text-anchor="middle" class="label mono" font-size="11">Host / Origin guard</text><text x="475.0" y="277" text-anchor="middle" class="label mono" font-size="11">rate and concurrency limits</text><text x="475.0" y="294" text-anchor="middle" class="label mono" font-size="11">multipart straight to S3</text><text x="475.0" y="311" text-anchor="middle" class="label mono" font-size="11">SSE progress streams</text></g>
<g><rect x="770" y="40" width="230" height="110" rx="5" fill="#18263a" stroke="#7aa2dc" stroke-width="1.5"/><text x="885.0" y="72" text-anchor="middle" class="title" font-size="15.5">PostgreSQL</text><text x="885.0" y="96" text-anchor="middle" class="label mono" font-size="11">source of truth for the Job</text><text x="885.0" y="113" text-anchor="middle" class="label mono" font-size="11">roles cf_api and cf_worker</text></g>
<g><rect x="770" y="275" width="230" height="110" rx="5" fill="#18263a" stroke="#7aa2dc" stroke-width="1.5"/><text x="885.0" y="307" text-anchor="middle" class="title" font-size="15.5">Redis + BullMQ</text><text x="885.0" y="331" text-anchor="middle" class="label mono" font-size="11">queues transcribe / burn</text><text x="885.0" y="348" text-anchor="middle" class="label mono" font-size="11">channel captionforge:cancel</text></g>
<g><rect x="770" y="520" width="230" height="110" rx="5" fill="#18263a" stroke="#7aa2dc" stroke-width="1.5"/><text x="885.0" y="552" text-anchor="middle" class="title" font-size="15.5">RustFS (S3 API)</text><text x="885.0" y="576" text-anchor="middle" class="label mono" font-size="11">jobs/ID/input and out/</text><text x="885.0" y="593" text-anchor="middle" class="label mono" font-size="11">separate credentials per service</text></g>
<g><rect x="1070" y="200" width="220" height="280" rx="5" fill="#2a2036" stroke="#b08ad6" stroke-width="1.5"/><text x="1180.0" y="232" text-anchor="middle" class="title" font-size="15.5">AI Worker</text><text x="1180.0" y="256" text-anchor="middle" class="label mono" font-size="11">Python, one heavy job at a time</text><text x="1180.0" y="273" text-anchor="middle" class="label mono" font-size="11"></text><text x="1180.0" y="290" text-anchor="middle" class="label mono" font-size="11">faster-whisper</text><text x="1180.0" y="307" text-anchor="middle" class="label mono" font-size="11">Argos Translate</text><text x="1180.0" y="324" text-anchor="middle" class="label mono" font-size="11">FFmpeg (minimal env)</text><text x="1180.0" y="341" text-anchor="middle" class="label mono" font-size="11">ephemeral /work, cleaned up</text></g>
<g stroke="#a89f8e" stroke-width="1.5" fill="none">
<line x1="250" y1="290" x2="338" y2="290" marker-end="url(#a)"/>
<line x1="338" y1="345" x2="252" y2="345" marker-end="url(#a)" stroke-dasharray="4 4"/>
<polyline points="610,215 690,215 690,95 768,95" marker-end="url(#a)"/>
<line x1="610" y1="330" x2="768" y2="330" marker-end="url(#a)"/>
<polyline points="610,420 690,420 690,575 768,575" marker-end="url(#a)"/>
<line x1="1000" y1="315" x2="1068" y2="315" marker-end="url(#a)"/>
<line x1="1068" y1="350" x2="1002" y2="350" marker-end="url(#a)" stroke-dasharray="4 4"/>
<polyline points="1180,198 1180,95 1002,95" marker-end="url(#a)"/>
<polyline points="1180,482 1180,575 1002,575" marker-end="url(#a)" marker-start="url(#a)"/>
</g>
<text x="294" y="280" text-anchor="middle" class="label mono" font-size="11">upload / REST</text>
<text x="294" y="366" text-anchor="middle" class="label mono" font-size="11">SSE progress</text>
<text x="700" y="190" text-anchor="start" class="label mono" font-size="11">Job row</text>
<text x="689" y="320" text-anchor="middle" class="label mono" font-size="11">enqueue</text>
<text x="700" y="448" text-anchor="start" class="label mono" font-size="11">stream upload (5 MiB parts)</text>
<text x="1034" y="305" text-anchor="middle" class="label mono" font-size="11">deliver</text>
<text x="1034" y="372" text-anchor="middle" class="label mono" font-size="11">cancel</text>
<text x="1090" y="85" text-anchor="start" class="label mono" font-size="11">conditional status updates</text>
<text x="1090" y="620" text-anchor="start" class="label mono" font-size="11">read input, write artifacts</text>
</svg>