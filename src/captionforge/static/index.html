<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaptionForge</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <h1>CaptionForge</h1>
        <p class="tagline">Subtítulos automáticos, 100% locales. Sin suscripción, sin límite, sin nube.</p>
      </header>

      <section id="upload-section" class="card">
        <div id="drop-zone" class="drop-zone">
          <p class="drop-zone__label">Arrastra un video aquí, o haz clic para elegir uno</p>
          <p class="drop-zone__hint">.mp4, .mov, .mkv, .webm, .avi</p>
          <input id="file-input" type="file" accept=".mp4,.mov,.mkv,.webm,.avi" hidden />
        </div>

        <div class="options">
          <label>
            Modelo
            <select id="model-size">
              <option value="base">base (más rápido)</option>
              <option value="small" selected>small (equilibrado)</option>
              <option value="medium">medium (más preciso)</option>
            </select>
          </label>
          <label>
            Idioma de origen
            <input id="language" type="text" placeholder="auto" maxlength="5" />
          </label>
          <label>
            Traducir a
            <input id="translate-to" type="text" placeholder="ninguno (p. ej. en, es)" maxlength="5" />
          </label>
        </div>

        <p id="selected-file" class="selected-file" hidden></p>
        <button id="upload-button" class="button button--primary" disabled>Generar subtítulos</button>
      </section>

      <section id="progress-section" class="card" hidden>
        <p id="stage-label" class="stage-label">En cola</p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-bar__fill"></div>
        </div>
      </section>

      <section id="error-section" class="card card--error" hidden>
        <p id="error-message"></p>
      </section>

      <section id="results-section" class="card" hidden>
        <h2>Listo</h2>
        <div class="results">
          <a id="download-srt" class="button" download>Descargar .srt</a>
          <button id="burn-button" class="button button--primary">Quemar en el video</button>
        </div>

        <div id="burn-progress" class="burn-progress" hidden>
          <p id="burn-stage-label" class="stage-label">Quemando subtítulos</p>
          <div class="progress-bar">
            <div id="burn-progress-fill" class="progress-bar__fill"></div>
          </div>
        </div>

        <a id="download-video" class="button button--primary" download hidden>Descargar video con subtítulos</a>

        <button id="restart-button" class="button button--ghost">Procesar otro video</button>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
