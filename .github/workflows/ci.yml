name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          # Real CI failure (macos-latest only, ubuntu/windows pass): every
          # burn-subtitles test errors with "No such filter: 'subtitles'",
          # meaning whatever ffmpeg ends up on PATH after `brew install
          # ffmpeg` lacks libass - most likely a non-Homebrew ffmpeg already
          # on this image's PATH ahead of Homebrew's own bin dir (`brew
          # install` no-ops with a warning if it thinks ffmpeg is already
          # present, and even a real install only manages Cellar symlinks,
          # not PATH ordering against a binary it doesn't own). Homebrew's
          # own ffmpeg formula depends on libass and does carry the filter -
          # prepending its bin dir to $GITHUB_PATH forces every later step in
          # this job to resolve `ffmpeg` there first. The "Diagnose" step
          # right after this one is what actually confirms which binary is
          # in play - read its output before trusting this fixed anything.
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"

      - name: Diagnose ffmpeg build (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg
          ffmpeg -version
          ffmpeg -filters | grep -i subtitles || echo "no subtitles filter found"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest
