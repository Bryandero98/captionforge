name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          # Real CI failure (macos-latest only, ubuntu/windows pass): every
          # burn-subtitles test errors with "No such filter: 'subtitles'".
          # First fix attempt here was prepending Homebrew's own ffmpeg bin
          # dir to PATH (in case some other, non-Homebrew ffmpeg was resolving
          # first) - the next CI run's "Diagnose" step below proved that
          # WRONG: Homebrew's `ffmpeg` formula was already the one resolving,
          # its `-version` configure line simply never passes
          # `--enable-libass` at all (confirmed straight from
          # homebrew-core's own Formula/f/ffmpeg.rb: the regular `ffmpeg`
          # formula deliberately ships a minimal codec set - "Add other
          # dependencies to ffmpeg-full formula" is literally a comment in
          # its source). homebrew-core ships a SEPARATE `ffmpeg-full` formula
          # for exactly this - it depends on libass/fontconfig/freetype and
          # has its own prebuilt bottle (no slow from-source compile), so
          # switching to it is a one-line change rather than a patched build.
          # It's `keg_only`, so its bin dir needs the same explicit
          # $GITHUB_PATH treatment as before.
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Diagnose ffmpeg build (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg
          ffmpeg -version
          ffmpeg -filters | grep -i subtitles || echo "no subtitles filter found"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest
