name: Release to PyPI

on:
  release:
    types: [published]

# Solo lectura por defecto; cada job pide únicamente lo que necesita.
permissions:
  contents: read

jobs:
  # Compila con solo lectura: este job instala herramientas de terceros (build y su entorno aislado) y NO tiene
  # permiso para pedir el token OIDC de PyPI. Si una de esas dependencias se comprometiera, no podría publicar.
  build:
    defaults:
      run:
        working-directory: legacy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install "build==1.6.1"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag ($GITHUB_REF_NAME) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: legacy/dist/
          if-no-files-found: error
          retention-days: 5

  # Publica sin compilar nada: solo descarga lo que construyó el job anterior y lo sube a PyPI.
  # Trusted Publishing (OIDC): PyPI valida la identidad de este workflow y no hay token de larga vida que robar.
  # Registrar el publicador en PyPI (proyecto > Publishing) con este repositorio, el workflow release.yml y el
  # entorno 'pypi'; y crear ese entorno en GitHub con revisores obligatorios y despliegue limitado a tags de release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
