# Mantiene al día lo que está fijado por SHA, por versión o por imagen (H9): sin esto, fijar las acciones y las
# dependencias congelaría también sus correcciones de seguridad. Un PR semanal por ecosistema, agrupado.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/ai-worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # Monorepo npm: el package-lock.json de la raíz cubre el API, los contratos y las herramientas.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /legacy
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-legacy:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /apps/ai-worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-worker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
