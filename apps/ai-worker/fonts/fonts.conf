<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig mínimo del worker: las fuentes de los subtítulos dinámicos (Montserrat ExtraBold y Nunito ExtraBold, SIL OFL) más las del sistema
     como respaldo. La caché se genera al construir la imagen (fc-cache); el contenedor es de solo lectura salvo /work. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/captionforge</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir>/usr/share/fonts/.fc-cache</cachedir>
</fontconfig>
