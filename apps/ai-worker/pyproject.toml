[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captionforge-ai-worker"
version = "0.1.0"
description = "AI Worker de CaptionForge: consume trabajos de BullMQ, transcribe con Whisper y deja el resultado en S3 y PostgreSQL."
requires-python = ">=3.11"
dependencies = [
  "bullmq==3.4.3",
  "redis>=6.2",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "pydantic>=2.7",
  # Contratos generados (packages/contracts/generated/python) y bloques de proceso del paquete
  # heredado (legacy/): se instalan desde sus carpetas, ver requirements-dev.txt y el Dockerfile.
  "captionforge-contracts",
  "captionforge",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# La limpieza de audio (cleanAudio, ADR 0013) NO es un extra de pip: demucs declara dependencias que no se pueden resolver
# en Python 3.12+ (diffq). Se instala con requirements-separation.txt (versiones fijadas, torch 2.11). Sin eso el trabajo
# sigue con el audio original.

[project.scripts]
ai-worker = "ai_worker.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
